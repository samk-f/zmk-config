# Every keyboard and mode lives on this one branch. Uncomment what you need.
# See readme.md for which files to flash in each mode.
---
include:
  # ── TOTEM: Bluetooth (left half is central) ──────────────────────────────
  - board: seeeduino_xiao_ble
    shield: totem_left
  - board: seeeduino_xiao_ble
    shield: totem_right

  # ── TOTEM: dongle (dongle is central, both halves are peripherals) ───────
  # totem_right is the same firmware in both modes.
  - board: seeeduino_xiao_ble
    shield: totem_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: seeeduino_xiao_ble
    shield: totem_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: totem_left_peripheral-seeeduino_xiao_ble-zmk

  # ── TOTEM: Prospector dongle (needs ZMK main + module, see readme) ───────
  # - board: seeeduino_xiao_ble
  #   shield: totem_dongle prospector_adapter
  #   snippet: studio-rpc-usb-uart
  #   cmake-args: -DCONFIG_ZMK_STUDIO=y

  # ── Corne: Bluetooth (stock ZMK corne shield; change board to suit) ─────
  - board: nice_nano_v2
    shield: corne_left
  - board: nice_nano_v2
    shield: corne_right

  # ── Corne: dongle ────────────────────────────────────────────────────────
  - board: seeeduino_xiao_ble
    shield: corne_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano_v2
    shield: corne_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_left_peripheral-nice_nano_v2-zmk

  # ── Settings reset (flash before switching modes / re-pairing) ──────────
  - board: seeeduino_xiao_ble
    shield: settings_reset
  - board: nice_nano_v2
    shield: settings_reset
